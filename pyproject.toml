[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcrf"
version = "0.1.0"
description = "Physics-Constrained Rectified Flow for climate downscaling"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Arun Sharma", email = "arun08sharma@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
]

[project.optional-dependencies]
data   = ["xarray>=2023.1", "netCDF4>=1.6", "cdsapi>=0.7", "dask>=2023.1", "rioxarray>=0.15", "rasterio>=1.3"]
train  = ["matplotlib>=3.7"]
# ray = the DDP TorchTrainer (apps/training/train_ray.py) and Ray Serve. It also
# covers the Ray Tune sweep (apps/training/tune_pcrf.py). pandas and tabulate
# support the leaderboard and the markdown summary of the scaling plots.
ray    = ["ray[train,tune,serve]>=2.30", "pandas>=2.0", "tabulate>=0.9"]
# Standalone HPO extra for installs that want Tune without serve.
tune   = ["ray[train,tune]>=2.30", "pandas>=2.0", "tabulate>=0.9"]
# torch.onnx.export(..., dynamo=False) needs torch 2.5 or newer.
export = ["torch>=2.5", "onnx>=1.16", "onnxscript>=0.1.0", "onnxruntime>=1.18"]
serve  = ["onnxruntime>=1.18", "fastapi>=0.111", "uvicorn[standard]>=0.30", "pydantic>=2.7", "matplotlib>=3.8"]
dev    = ["pytest>=8"]
all    = [
  "xarray>=2023.1", "netCDF4>=1.6", "cdsapi>=0.7", "dask>=2023.1", "rioxarray>=0.15", "rasterio>=1.3",
  "matplotlib>=3.8",
  "ray[train,tune,serve]>=2.30",
  "onnx>=1.16", "onnxscript>=0.1.0", "onnxruntime>=1.18",
  "fastapi>=0.111", "uvicorn[standard]>=0.30", "pydantic>=2.7",
  "pandas>=2.0", "tabulate>=0.9",
  "pytest>=8",
]

[project.scripts]
pcrf-smoke    = "pcrf.smoke_test:main"
pcrf-train    = "pcrf.train:main"
pcrf-evaluate = "pcrf.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pcrf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
